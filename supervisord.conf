; Every part of one shared browser. Each one is started again when it stops.
[supervisord]
nodaemon=true
logfile=/var/log/shared-browser/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The display everything is drawn on, as large as SB_SCREEN (WIDTHxHEIGHT@FPS) says.
[program:display]
command=/bin/sh -c 'exec Xvfb :99 -screen 0 "${SB_SCREEN%%@*}x24" -nolisten tcp'
autorestart=true
priority=100
stdout_logfile=/var/log/shared-browser/display.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:openbox]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec openbox --config-file /opt/shared-browser/openbox.xml'
autorestart=true
priority=200
stdout_logfile=/var/log/shared-browser/openbox.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:chrome]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec /usr/local/bin/browser \
  --remote-debugging-port=9222 \
  --remote-allow-origins=* \
  --user-data-dir=/home/browser/profile \
  --window-position=0,0 \
  --start-maximized \
  --no-first-run \
  --no-default-browser-check \
  --disable-gpu \
  --disable-software-rasterizer \
  --disable-dev-shm-usage \
  --lang=$SB_LANG \
  $SB_CHROME_FLAGS \
  $SB_HOME_URL'
stopsignal=INT
autorestart=true
priority=300
stdout_logfile=/var/log/shared-browser/chrome.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; Chrome binds CDP to the container's loopback only; forward it to the container interface so compose can publish it.
[program:cdp]
command=socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
autorestart=true
priority=400
stdout_logfile=/var/log/shared-browser/cdp.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; What people see and touch: the display over WebRTC, their mouse and keys back into it.
[program:screen]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec python3 /opt/shared-browser/screen.py'
autorestart=true
priority=400
stdout_logfile=/var/log/shared-browser/screen.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; Playwright MCP, driving the same browser over CDP. Reached only through the gate at /mcp.
[program:mcp]
command=/usr/local/bin/node /opt/mcp/node_modules/@playwright/mcp/cli.js --cdp-endpoint http://127.0.0.1:9222 --host localhost --port 8083
autorestart=true
priority=500
stdout_logfile=/var/log/shared-browser/mcp.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:gate]
environment=GATE_BASE="%(ENV_SB_VIEWER_URL)s",GATE_NAME="%(ENV_SB_NAME)s",GATE_SESSION_HOURS="%(ENV_SB_SESSION_HOURS)s"
command=python3 /opt/shared-browser/gate.py
autorestart=true
priority=600
stdout_logfile=/var/log/shared-browser/gate.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
