[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/xdg/openbox/rc.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:chrome]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/sh -c "exec /usr/local/bin/browser \
  --no-sandbox \
  --remote-debugging-port=9222 \
  --remote-allow-origins=* \
  --user-data-dir=/home/neko/profile \
  --display=$DISPLAY \
  --window-position=0,0 \
  --start-maximized \
  --no-first-run \
  --no-default-browser-check \
  --disable-gpu \
  --disable-software-rasterizer \
  --disable-dev-shm-usage \
  --lang=$SB_LANG \
  $SB_CHROME_FLAGS \
  $SB_HOME_URL"
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chrome.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

# Chrome binds CDP to the container's loopback only; forward it to the container interface so compose can publish it.
[program:cdp]
command=socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
autorestart=true
priority=900
user=root
stdout_logfile=/var/log/neko/cdp.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:gate]
environment=GATE_BASE="%(ENV_SB_VIEWER_URL)s",GATE_NAME="%(ENV_SB_NAME)s",GATE_SESSION_HOURS="%(ENV_SB_SESSION_HOURS)s"
command=/usr/bin/python3 /usr/local/bin/gate.py
autorestart=true
priority=850
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/gate.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

# Playwright MCP, driving the same browser over CDP. Reached only through the gate at /mcp.
[program:mcp]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/local/bin/node /opt/mcp/node_modules/@playwright/mcp/cli.js --cdp-endpoint http://127.0.0.1:9222 --host localhost --port 8083
autorestart=true
priority=870
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/mcp.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /etc/neko/nginx.conf
autorestart=true
priority=950
user=root
stdout_logfile=/var/log/neko/nginx.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
