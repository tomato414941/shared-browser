daemon off;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/nginx-body; proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi; uwsgi_temp_path /tmp/nginx-uwsgi; scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  # 8082 is the gate: it decides who may come in. 8081 is the screen server, which has no authentication of
  # its own, so nothing reaches it without the gate's say.
  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;

    location /go/ { proxy_pass http://127.0.0.1:8082; }
    location = /whoami { proxy_pass http://127.0.0.1:8082; }
    location /measure { proxy_pass http://127.0.0.1:8082; }
    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:8082;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location @link { proxy_pass http://127.0.0.1:8082; }

    # Agents: the gate checks the key and carries the connection.
    location /mcp {
      proxy_pass http://127.0.0.1:8082;
      proxy_buffering off;
      proxy_request_buffering off;
    }
    location /cdp {
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
    }

    # People: the screen's live connection goes through the gate, so a revocation can close it.
    location ~ ^/(api/)?ws$ {
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # Everything else the viewer loads is served by the screen server once the gate has recognized the session.
    location / {
      auth_request /_auth;
      error_page 401 = @link;
      proxy_pass http://127.0.0.1:8081;
    }
  }
}
