daemon off;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/nginx-body; proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi; uwsgi_temp_path /tmp/nginx-uwsgi; scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  # 8082 is the gate: it owns the URL space and decides who may come in.
  # 8081 is the screen server. It owns /screen/ and nothing else, and has no authentication of its own.
  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;

    location / { proxy_pass http://127.0.0.1:8082; }
    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:8082;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Connections that stay open, for agents and for the screen: the gate checks them and carries them.
    location ~ ^/(cdp|mcp)(/|$)|^/screen/(.*/)?ws$ {
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # The screen's own pages and files, once the gate has recognized the session.
    location /screen/ {
      auth_request /_auth;
      error_page 401 = @gate;
      proxy_pass http://127.0.0.1:8081;
    }
    location @gate { proxy_pass http://127.0.0.1:8082; }
  }
}
