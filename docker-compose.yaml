# One shared browser. Values come from an instance file (instances/<name>.env) via --env-file.
services:
  browser:
    image: shared-browser:latest
    build: .
    container_name: shared-browser-${SB_NAME}
    restart: unless-stopped
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN    # lets the browser build its own sandbox
    ports:
      - "127.0.0.1:${SB_WEB_PORT}:8080"      # the gate (put an HTTPS front in front to reach it remotely)
      - "127.0.0.1:${SB_CDP_PORT}:9223"      # CDP, unauthenticated: loopback only
      # The screen's WebRTC, one port for each person watching at once. Docker publishes past host firewalls;
      # narrow it with SB_WEBRTC_BIND.
      - "${SB_WEBRTC_BIND}:${SB_WEBRTC_PORT}:${SB_WEBRTC_PORT}/udp"
    volumes:
      - "${SB_PROFILE_DIR}:/home/browser/profile"   # the browser's own profile
      - "${SB_STATE_DIR}:/home/browser/state"       # the gate's: principals, links, sessions
    environment:
      SB_NAME: ${SB_NAME}
      SB_HOME_URL: ${SB_HOME_URL}
      SB_LANG: ${SB_LANG}
      SB_CHROME_FLAGS: ${SB_CHROME_FLAGS}
      SB_SCREEN: ${SB_SCREEN}
      SB_VIEWER_URL: ${SB_VIEWER_URL}
      SB_SESSION_HOURS: ${SB_SESSION_HOURS}
      SB_WEBRTC_PORT: ${SB_WEBRTC_PORT}
      SB_PUBLIC_IP: ${SB_PUBLIC_IP}
      SB_STUN: ${SB_STUN}
      SB_ICE_SERVERS: ${SB_ICE_SERVERS}
