# One shared browser. Values come from an instance file (instances/<name>.env) via --env-file.
services:
  browser:
    image: shared-browser:latest
    build: .
    container_name: shared-browser-${SB_NAME}
    restart: unless-stopped
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN    # lets the browser build its own sandbox
    ports:
      - "127.0.0.1:${SB_WEB_PORT}:8080"      # viewer (put a reverse proxy in front to reach it remotely)
      - "127.0.0.1:${SB_CDP_PORT}:9223"      # CDP, unauthenticated: loopback only
      - "${SB_WEBRTC_BIND}:${SB_WEBRTC_PORT}:${SB_WEBRTC_PORT}/udp"   # Docker publishes past host firewalls; narrow with SB_WEBRTC_BIND
      - "${SB_WEBRTC_BIND}:${SB_WEBRTC_PORT}:${SB_WEBRTC_PORT}/tcp"
    volumes:
      - "${SB_PROFILE_DIR}:/home/neko/profile"   # the browser's own profile
      - "${SB_STATE_DIR}:/home/neko/state"       # the gate's: principals, links, sessions
    environment:
      SB_HOME_URL: ${SB_HOME_URL}
      SB_LANG: ${SB_LANG}
      SB_CHROME_FLAGS: ${SB_CHROME_FLAGS}
      SB_VIEWER_URL: ${SB_VIEWER_URL}
      SB_NAME: ${SB_NAME}
      SB_SESSION_HOURS: ${SB_SESSION_HOURS}
      NEKO_DESKTOP_SCREEN: ${SB_SCREEN}
      NEKO_CAPTURE_VIDEO_CODEC: ${SB_VIDEO_CODEC}
      NEKO_CAPTURE_VIDEO_IDS: ${SB_VIDEO_IDS}
      NEKO_CAPTURE_VIDEO_PIPELINES: ${SB_VIDEO_PIPELINES}
      NEKO_WEBRTC_UDPMUX: ${SB_WEBRTC_PORT}
      NEKO_WEBRTC_TCPMUX: ${SB_WEBRTC_PORT}
      NEKO_WEBRTC_NAT1TO1: ${SB_PUBLIC_IP}
      NEKO_WEBRTC_ICELITE: ${SB_ICE_LITE}
      NEKO_WEBRTC_ICESERVERS_FRONTEND: ${SB_ICE_SERVERS}
      NEKO_WEBRTC_ICESERVERS_BACKEND: ${SB_ICE_SERVERS}
      NEKO_SERVER_PROXY: "true"
      # neko is the screen: it lives under /screen/, behind the gate, and decides nothing about who comes in.
      NEKO_SERVER_BIND: 127.0.0.1:8081
      NEKO_SERVER_PATH_PREFIX: /screen
      NEKO_MEMBER_PROVIDER: noauth
      NEKO_SESSION_IMPLICIT_HOSTING: "true"   # whoever touches the screen has it; there is no button to ask
